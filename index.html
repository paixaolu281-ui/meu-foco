<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MEU FOCO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#63C77E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --nav-h: 64px;
}

/* ===== THEMES ===== */
[data-theme="dark"]{
  --bg: #0E1416;
  --bg-elev: #131A1D;
  --surface: #182022;
  --surface-2: #1E2729;
  --border: #283134;
  --text: #ECF2F1;
  --text-2: #9BAAA7;
  --text-3: #6C7A78;
  --primary: #4FBDA6;
  --primary-ink: #06201B;
  --accent: #E8B04B;
  --danger: #E2695E;
  --good: #4FBDA6;
  --warn: #E8B04B;
  --bad: #E2695E;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
}
[data-theme="light"]{
  --bg: #F6F5F1;
  --bg-elev: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F0EEE8;
  --border: #E4E1D8;
  --text: #1C201F;
  --text-2: #6B716D;
  --text-3: #9AA09B;
  --primary: #2F8F79;
  --primary-ink: #FFFFFF;
  --accent: #C6862B;
  --danger: #C24B41;
  --good: #2F8F79;
  --warn: #C6862B;
  --bad: #C24B41;
  --shadow: 0 10px 24px rgba(30,30,20,0.08);
}
[data-theme="blue"]{
  --bg: #0D1420;
  --bg-elev: #121A2A;
  --surface: #16203163;
  --surface: #162031;
  --surface-2: #1C2A3F;
  --border: #263752;
  --text: #EAF0FA;
  --text-2: #93A5C2;
  --text-3: #63769A;
  --primary: #5B9BF0;
  --primary-ink: #071227;
  --accent: #E8B04B;
  --danger: #E2695E;
  --good: #5B9BF0;
  --warn: #E8B04B;
  --bad: #E2695E;
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
}
[data-theme="green"]{
  --bg: #0D1712;
  --bg-elev: #121F19;
  --surface: #17251E;
  --surface-2: #1E3026;
  --border: #294036;
  --text: #EAF3EE;
  --text-2: #92AC9E;
  --text-3: #647E71;
  --primary: #63C77E;
  --primary-ink: #08210F;
  --accent: #E8B04B;
  --danger: #E2695E;
  --good: #63C77E;
  --warn: #E8B04B;
  --bad: #E2695E;
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
}
[data-theme="pink"]{
  --bg: #FBF3F5;
  --bg-elev: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F7E9EC;
  --border: #F0D9DF;
  --text: #2A1B1F;
  --text-2: #7A6367;
  --text-3: #A5898D;
  --primary: #C15C74;
  --primary-ink: #FFFFFF;
  --accent: #C6862B;
  --danger: #C24B41;
  --good: #C15C74;
  --warn: #C6862B;
  --bad: #C24B41;
  --shadow: 0 10px 24px rgba(90,30,40,0.08);
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  transition: background .25s ease, color .25s ease;
}
h1,h2,h3,.num-display{ font-family: 'Fraunces', serif; letter-spacing: -0.01em; }
button{ font-family: inherit; }
::selection{ background: var(--primary); color: var(--primary-ink); }

a{color:inherit;}
button{ cursor:pointer; }
input,select,textarea{
  font-family:inherit; font-size:15px; color:var(--text); background:var(--surface-2);
  border:1px solid var(--border); border-radius: var(--radius-sm); padding:11px 13px; width:100%;
  outline:none; transition: border-color .15s ease;
}
input:focus,select:focus,textarea:focus{ border-color: var(--primary); }
label{ font-size:13px; color:var(--text-2); font-weight:600; display:block; margin-bottom:6px; }
.field{ margin-bottom:16px; }
textarea{ resize: vertical; min-height:70px; }

.app-shell{ max-width: 1200px; margin:0 auto; display:flex; min-height:100vh; }

/* ===== SIDEBAR (desktop) ===== */
.sidebar{
  width: 250px; flex-shrink:0; padding: 28px 18px; display:none;
  border-right: 1px solid var(--border);
  position: sticky; top:0; height:100vh; flex-direction:column;
}
.sidebar .logo{ font-size:22px; font-weight:600; padding: 0 10px 26px 10px; }
.sidebar .logo span{ color: var(--primary); }
.sidebar nav{ display:flex; flex-direction:column; gap:4px; flex:1; }
.side-link{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius: var(--radius-sm);
  background:transparent; border:none; color:var(--text-2); font-size:15px; font-weight:600; text-align:left;
  transition: background .15s ease, color .15s ease;
}
.side-link .ic{ font-size:18px; width:22px; text-align:center; }
.side-link:hover{ background: var(--surface); color:var(--text); }
.side-link.active{ background: var(--surface); color: var(--primary); }
.sidebar .bottom-link{ margin-top:auto; }

/* ===== MAIN ===== */
.main-col{ flex:1; min-width:0; padding-bottom: calc(var(--nav-h) + 26px); }
.topbar-mobile{ display:flex; align-items:center; justify-content:space-between; padding: 18px 18px 4px 18px; }
.page{ padding: 8px 18px 40px 18px; max-width: 720px; }
@media (min-width:760px){ .page{ padding: 32px 34px 40px 34px; } }

.card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md);
  padding:18px; margin-bottom:14px; box-shadow: var(--shadow);
}
.card.flat{ box-shadow:none; }

.section-title{ font-size:15px; font-weight:700; margin: 22px 0 12px 0; color:var(--text); }
.section-title:first-child{ margin-top:0; }

/* ===== TODAY HEADER ===== */
.greet-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.greet-row h1{ font-size:22px; margin:0 0 2px 0; font-weight:600; }
.greet-row .date{ color:var(--text-2); font-size:13.5px; margin:0; }
.greet-actions{ display:flex; align-items:center; gap:10px; }
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--text);
  position:relative;
}
.icon-btn:active{ transform: scale(.94); }
.avatar{
  width:40px; height:40px; border-radius:50%; background: var(--primary); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
}
.streak-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
  padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; color:var(--accent);
}

/* discipline card */
.discipline-card{
  background: linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%);
  border:1px solid var(--border); border-radius: var(--radius-lg); padding:24px; margin-bottom:18px;
  box-shadow: var(--shadow); position:relative; overflow:hidden;
}
.discipline-top{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px;}
.discipline-label{ font-size:13.5px; color:var(--text-2); font-weight:600; }
.discipline-pct{ font-size:52px; line-height:1; font-weight:600; }
.bar-track{ height:10px; border-radius:999px; background: var(--border); overflow:hidden; margin: 10px 0 12px 0;}
.bar-fill{ height:100%; border-radius:999px; background: var(--primary); transition: width .5s cubic-bezier(.4,0,.2,1); }
.discipline-sub{ font-size:13.5px; color:var(--text-2); }
.stat-row{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top:16px; }
.stat-chip{ background:var(--bg-elev); border:1px solid var(--border); border-radius: var(--radius-sm); padding:10px; text-align:center; }
.stat-chip .v{ font-size:17px; font-weight:700; }
.stat-chip .l{ font-size:11px; color:var(--text-2); margin-top:2px; }
.motiv-line{ font-size:13.5px; color: var(--text-2); margin-top:14px; font-style:italic; }

/* priorities & tasks */
.item-row{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-md); padding:13px 14px; margin-bottom:9px; transition: opacity .2s ease, transform .2s ease;
}
.item-row.completed{ opacity:.55; }
.checkbox{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; background:transparent;
  display:flex; align-items:center; justify-content:center; font-size:13px; color: var(--primary-ink); transition: all .15s ease;
}
.checkbox.checked{ background: var(--primary); border-color: var(--primary); }
.item-body{ flex:1; min-width:0; }
.item-name{ font-size:15px; font-weight:600; }
.item-row.completed .item-name{ text-decoration: line-through; }
.item-meta{ display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
.tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-2); }
.tag.prio{ background: rgba(232,176,75,.16); color: var(--accent); }
.xp-tag{ font-size:12px; font-weight:700; color:var(--primary); }
.item-actions{ display:flex; gap:4px; flex-shrink:0; }
.mini-btn{ background:transparent; border:none; color:var(--text-3); font-size:15px; padding:6px; border-radius:8px; }
.mini-btn:hover{ background:var(--surface-2); color:var(--text); }

.empty-state{ text-align:center; padding: 30px 16px; color: var(--text-2); }
.empty-state .e-icon{ font-size:34px; margin-bottom:8px; }
.empty-state .e-title{ font-weight:700; color:var(--text); margin-bottom:4px; }
.empty-state .e-sub{ font-size:13.5px; }

.add-btn{
  width:100%; padding:13px; border-radius: var(--radius-md); border:1.5px dashed var(--border); background:transparent;
  color: var(--text-2); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.add-btn:hover{ border-color: var(--primary); color: var(--primary); }

.fab{
  position:fixed; right:20px; bottom: calc(var(--nav-h) + 22px); width:56px; height:56px; border-radius:50%;
  background: var(--primary); color: var(--primary-ink); border:none; font-size:26px; box-shadow: var(--shadow);
  display:flex; align-items:center; justify-content:center; z-index:40;
}
@media (min-width:760px){ .fab{ bottom:28px; } }
.fab:active{ transform: scale(.93); }

/* period headers */
.period-head{ display:flex; align-items:center; gap:8px; margin: 20px 0 10px 0; font-weight:700; font-size:14px; color:var(--text-2); }

/* bottom nav */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; height: var(--nav-h); background: var(--bg-elev);
  border-top:1px solid var(--border); display:flex; z-index:50;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color: var(--text-3); font-size:10.5px; font-weight:700;
}
.nav-btn .ic{ font-size:19px; }
.nav-btn.active{ color: var(--primary); }

@media (min-width:760px){
  .bottom-nav{ display:none; }
  .sidebar{ display:flex; }
  .topbar-mobile{ display:none; }
  .main-col{ padding-bottom:0; }
  .fab{ display: none; }
}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center;
  z-index:100; animation: fadeIn .18s ease;
}
@media (min-width:760px){ .modal-overlay{ align-items:center; } }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-box{
  background: var(--bg-elev); border-radius: 22px 22px 0 0; padding:22px; width:100%; max-width:480px;
  max-height:88vh; overflow-y:auto; animation: slideUp .22s cubic-bezier(.3,.8,.4,1);
  border:1px solid var(--border); border-bottom:none;
}
@media (min-width:760px){ .modal-box{ border-radius:22px; border-bottom:1px solid var(--border); max-height:82vh; } }
@keyframes slideUp{ from{ transform: translateY(30px); opacity:0;} to{ transform: translateY(0); opacity:1;} }
.modal-title{ font-size:19px; font-weight:600; margin:0 0 18px 0; }
.chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
.chip-opt{
  padding:9px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-2);
  font-size:13.5px; font-weight:600;
}
.chip-opt.selected{ background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.modal-actions{ display:flex; gap:10px; margin-top:22px; }
.btn{
  flex:1; padding:13px; border-radius: var(--radius-sm); border:none; font-weight:700; font-size:14.5px;
}
.btn-primary{ background: var(--primary); color: var(--primary-ink); }
.btn-ghost{ background: var(--surface-2); color: var(--text); }
.btn-danger{ background: var(--danger); color:#fff; }
.btn:active{ transform: scale(.97); }
.btn-block{ width:100%; margin-top:10px; }

/* toast */
.toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%); background: var(--bg-elev); border:1px solid var(--border);
  color:var(--text); padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow);
  z-index:200; display:flex; align-items:center; gap:8px; animation: toastIn .25s ease;
}
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,-14px);} to{opacity:1; transform:translate(-50%,0);} }

/* celebration overlay */
.celebrate-overlay{
  position:fixed; inset:0; background: rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center;
  z-index:300; animation: fadeIn .2s ease;
}
.celebrate-card{
  background: var(--bg-elev); border:1px solid var(--border); border-radius:24px; padding:36px 30px; text-align:center;
  max-width:320px; animation: popIn .3s cubic-bezier(.3,1.4,.4,1);
}
@keyframes popIn{ from{ transform: scale(.8); opacity:0;} to{ transform: scale(1); opacity:1;} }
.celebrate-emoji{ font-size:52px; margin-bottom:10px; }
.celebrate-title{ font-size:20px; font-weight:600; margin-bottom:6px; }
.celebrate-sub{ color:var(--text-2); font-size:14px; margin-bottom:20px; }

/* routine timeline */
.timeline{ position:relative; padding-left:26px; }
.timeline::before{ content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--border); }
.timeline-item{ position:relative; margin-bottom:16px; }
.timeline-item::before{
  content:''; position:absolute; left:-26px; top:4px; width:12px; height:12px; border-radius:50%;
  background: var(--primary); border:3px solid var(--bg-elev);
}
.timeline-time{ font-size:12.5px; font-weight:700; color:var(--primary); }
.timeline-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 13px; margin-top:5px; display:flex; justify-content:space-between; align-items:center; }

/* habit card */
.habit-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:9px;}
.habit-days{ display:flex; gap:3px; margin-top:5px; }
.day-dot{ width:16px; height:16px; border-radius:50%; font-size:8.5px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--text-3); font-weight:700;}
.day-dot.on{ background:var(--primary); color:var(--primary-ink); }

/* goals */
.goal-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:12px; }
.goal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.goal-title{ font-weight:700; font-size:15.5px; }
.goal-desc{ font-size:13px; color:var(--text-2); margin:3px 0 10px 0; }
.goal-progress-num{ display:flex; justify-content:space-between; font-size:13px; color:var(--text-2); margin-top:6px; }
.goal-deadline{ font-size:12px; color:var(--text-3); margin-top:8px; }
.goal-card.completed{ opacity:.65; }

/* calendar */
.cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
.cal-dow{ text-align:center; font-size:11px; color:var(--text-3); font-weight:700; padding-bottom:4px; }
.cal-day{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:600; border:1px solid transparent; background:var(--surface-2); color:var(--text-2);
}
.cal-day .dot{ width:6px; height:6px; border-radius:50%; margin-top:3px; }
.cal-day.today{ border-color: var(--primary); color:var(--text); }
.cal-day.empty{ background:transparent; }
.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-nav .m-title{ font-weight:700; font-size:15.5px; }

/* progress bars simple */
.hbar-row{ margin-bottom:12px; }
.hbar-label{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
.hbar-track{ height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.hbar-fill{ height:100%; border-radius:999px; background:var(--primary); transition: width .4s ease; }

/* achievements */
.ach-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }
@media (min-width:560px){ .ach-grid{ grid-template-columns: repeat(3,1fr); } }
.ach-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 10px; text-align:center; }
.ach-card.locked{ opacity:.4; filter:grayscale(1); }
.ach-emoji{ font-size:30px; margin-bottom:8px; }
.ach-name{ font-size:12.5px; font-weight:700; }
.ach-date{ font-size:10.5px; color:var(--text-3); margin-top:3px; }

/* journal */
.star-row{ display:flex; gap:6px; font-size:26px; }
.star{ opacity:.3; }
.star.on{ opacity:1; }
.journal-entry{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:10px; }
.journal-date{ font-size:12.5px; font-weight:700; color:var(--primary); margin-bottom:6px; }
.journal-q{ font-size:11.5px; color:var(--text-3); font-weight:700; margin-top:8px; }
.journal-a{ font-size:13.5px; margin-top:2px; }

/* focus mode */
.focus-wrap{ display:flex; flex-direction:column; align-items:center; padding: 20px 0 10px 0; }
.focus-ring{ width:260px; height:260px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; margin: 10px 0 26px 0;}
.focus-time{ font-size:52px; font-weight:600; font-family:'Fraunces',serif; }
.focus-controls{ display:flex; gap:14px; }
.focus-btn{ width:60px; height:60px; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:22px; display:flex; align-items:center; justify-content:center; }
.focus-btn.primary{ background: var(--primary); color:var(--primary-ink); border:none; width:72px; height:72px; font-size:26px; }
.dur-opt{ padding:10px 16px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); font-weight:700; font-size:13.5px; color:var(--text-2); }
.dur-opt.selected{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }

/* settings */
.set-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); }
.set-row:last-child{ border-bottom:none; }
.set-label{ font-size:14.5px; font-weight:600; }
.set-sub{ font-size:12px; color:var(--text-2); margin-top:2px; }
.switch{ width:46px; height:26px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex-shrink:0; }
.switch.on{ background:var(--primary); border-color:var(--primary); }
.switch .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .18s ease; }
.switch.on .knob{ transform:translateX(20px); }
.theme-swatch{ width:38px; height:38px; border-radius:50%; border:2px solid transparent; flex-shrink:0; }
.theme-swatch.selected{ border-color: var(--text); }

/* onboarding */
.onb-wrap{ min-height:100vh; display:flex; flex-direction:column; padding:30px 24px; }
.onb-content{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:420px; margin:0 auto; width:100%; }
.onb-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:22px; }
.onb-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.onb-dot.active{ background:var(--primary); width:20px; border-radius:4px; }

<body data-theme="dark">
<div id="loadingScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;">
  <div style="font-family:'Fraunces',serif; font-size:26px; font-weight:600;">MEU FOCO</div>
  <div class="small-muted">Um dia de cada vez.</div>
</div>
<div id="root" class="hidden"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ================= CONSTANTS ================= */
const STORAGE_KEY = 'meufoco_state_v2';
const DOW = ['D','S','T','Q','Q','S','S'];
const DOW_FULL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATEGORIES = [
  {id:'trabalho', label:'Trabalho', ic:'💼'},
  {id:'estudos', label:'Estudos', ic:'📚'},
  {id:'saude', label:'Saúde', ic:'❤️'},
  {id:'pessoal', label:'Pessoal', ic:'👤'},
  {id:'casa', label:'Casa', ic:'🏠'},
  {id:'financeiro', label:'Financeiro', ic:'💰'},
  {id:'outro', label:'Outro', ic:'📦'},
];
const GOAL_CATEGORIES = [
  {id:'financas', label:'Finanças', ic:'💰'},
  {id:'saude', label:'Saúde', ic:'❤️'},
  {id:'estudos', label:'Estudos', ic:'📚'},
  {id:'trabalho', label:'Trabalho', ic:'💼'},
  {id:'pessoal', label:'Pessoal', ic:'👤'},
  {id:'relacionamentos', label:'Relacionamentos', ic:'❤️'},
  {id:'outros', label:'Outros', ic:'📦'},
];
const DIFFICULTY_XP = {facil:5, media:10, dificil:20};
const ACHIEVEMENTS = [
  {id:'first_step', name:'Primeiro passo', emoji:'🥇', desc:'Conclua sua primeira tarefa'},
  {id:'streak7', name:'7 dias seguidos', emoji:'🔥', desc:'Sequência de 7 dias'},
  {id:'streak30', name:'30 dias seguidos', emoji:'🔥', desc:'Sequência de 30 dias'},
  {id:'streak100', name:'100 dias seguidos', emoji:'🔥', desc:'Sequência de 100 dias'},
  {id:'streak365', name:'365 dias seguidos', emoji:'🔥', desc:'Sequência de 365 dias'},
  {id:'early_bird', name:'Madrugador', emoji:'🌅', desc:'Conclua algo antes das 7h'},
  {id:'reader', name:'Leitor', emoji:'📚', desc:'Conclua um hábito de leitura 5 vezes'},
  {id:'first_goal', name:'Primeira meta concluída', emoji:'🎯', desc:'Conclua sua primeira meta'},
  {id:'xp1000', name:'1.000 XP', emoji:'⚡', desc:'Acumule 1.000 XP'},
  {id:'xp10000', name:'10.000 XP', emoji:'⚡', desc:'Acumule 10.000 XP'},
];
const MOTIV = {
  start: 'Vamos começar. Um passo de cada vez.',
  low: 'Você está indo bem.',
  half: 'Metade do caminho. Continue.',
  full: 'Dia concluído. Você fez sua parte.',
  bad: 'Nem todo dia será perfeito. Continue amanhã.',
  streakLost: 'Hoje não saiu como você queria. Tudo bem. Amanhã é uma nova oportunidade.'
};

/* ================= STATE ================= */
let state = null;
let saveTimer = null;
let focusTimer = null;
let toastTimer = null;


// MEU FOCO 2.1: alarm state is initialized inside defaultState/loadState
function defaultState(){
  const today = todayStr();
  return {
    alarms: [],
    alarmLastFired: {},

    user:{ name:'', wake:'06:30', sleep:'22:30', dailyGoal:80, onboarded:false, avatar:'🙂' },
    tasks:[
      {id:uid(), name:'Beber água ao acordar', time:'07:00', period:'manha', category:'saude', difficulty:'facil', priority:'normal', xp:5, date:today, completed:false, isPriority:true},
      {id:uid(), name:'Exercício físico', time:'07:30', period:'manha', category:'saude', difficulty:'media', priority:'alta', xp:10, date:today, completed:false, isPriority:true},
      {id:uid(), name:'Bloco de trabalho focado', time:'10:00', period:'manha', category:'trabalho', difficulty:'dificil', priority:'alta', xp:20, date:today, completed:false, isPriority:true},
      {id:uid(), name:'Ler 20 minutos', time:'18:00', period:'tarde', category:'estudos', difficulty:'facil', priority:'normal', xp:5, date:today, completed:false, isPriority:false},
      {id:uid(), name:'Planejar amanhã', time:'22:00', period:'noite', category:'pessoal', difficulty:'facil', priority:'normal', xp:5, date:today, completed:false, isPriority:false},
    ],
    habits:[
      {id:uid(), name:'Beber 2L de água', days:[0,1,2,3,4,5,6], time:'', category:'saude', xp:5},
      {id:uid(), name:'Meditar 10 minutos', days:[1,2,3,4,5], time:'07:00', category:'saude', xp:10},
    ],
    habitLog:{},
    routine:[
      {id:uid(), time:'06:30', label:'Acordar'},
      {id:uid(), time:'07:00', label:'Exercício'},
      {id:uid(), time:'08:00', label:'Trabalho'},
      {id:uid(), time:'12:00', label:'Almoço'},
      {id:uid(), time:'14:00', label:'Estudos'},
      {id:uid(), time:'18:00', label:'Exercício'},
      {id:uid(), time:'22:30', label:'Dormir'},
    ],
    goals:[],
    challenges:[],
    rewards:[],
    recurringTasks:[],
    quickNotes:[],
    sleepLog:{},
    tomorrowPlan:{},
    history:{},
    xp:0,
    focusSessions:[],
    journal:{},
    streak:{current:0, longest:0},
    achievements:{},
    stats:{totalTasksCompleted:0, totalHabitsCompleted:0, earlyCompletions:0, readingCompletions:0, goalsCompleted:0},
    settings:{theme:'dark', sounds:true, notifications:false},
    page: 'onboarding'
  };
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function pad(n){ return n<10?'0'+n:''+n; }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dateFromStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(dateStr, n){ const d=dateFromStr(dateStr); d.setDate(d.getDate()+n); return todayStr(d); }
function niceDate(d){
  d = d || new Date();
  return DOW_FULL[d.getDay()].slice(0,3)+', '+d.getDate()+' de '+MONTHS[d.getMonth()];
}

/* ================= PERSISTENCE ================= */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const loaded = JSON.parse(raw);
      const defaults = defaultState();
      state = Object.assign(defaults, loaded);
      // deep-merge nested defaults for safety
      state.user = Object.assign(defaults.user, loaded.user||{});
      state.settings = Object.assign(defaults.settings, loaded.settings||{});
      state.stats = Object.assign(defaults.stats, loaded.stats||{});
      state.streak = Object.assign(defaults.streak, loaded.streak||{});
      state.habitLog = Object.assign(defaults.habitLog, loaded.habitLog||{});
      state.journal = Object.assign(defaults.journal, loaded.journal||{});
      state.achievements = Object.assign(defaults.achievements, loaded.achievements||{});
    } else {
      state = defaultState();
    }
  }catch(e){
    console.error('Falha ao carregar dados', e);
    state = defaultState();
  }
  if(!state.user.onboarded) state.page='onboarding';
  else if(!state.page || state.page==='onboarding') state.page='hoje';
  state.alarms=Array.isArray(state.alarms)?state.alarms:[]; state.alarmLastFired=state.alarmLastFired||{};
recomputeAll();
  document.body.setAttribute('data-theme', state.settings.theme);
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('root').classList.remove('hidden');
  render();
}

function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Falha ao salvar', e); }
  }, 250);
}

/* ================= CORE CALCULATIONS ================= */
function getLevelInfo(xp){
  let level=1, remaining=xp, needed=300;
  while(remaining>=needed){ remaining-=needed; level++; needed = 300+(level-1)*50; }
  return {level, xpInLevel:remaining, xpNeeded:needed};
}

function habitsForDate(dateStr){
  const dow = dateFromStr(dateStr).getDay();
  return state.habits.filter(h=>h.days.includes(dow));
}

function dayRecord(dateStr){
  const tasks = state.tasks.filter(t=>t.date===dateStr);
  const doneTasks = tasks.filter(t=>t.completed).length;
  const habits = habitsForDate(dateStr);
  const log = state.habitLog[dateStr]||[];
  const doneHabits = habits.filter(h=>log.includes(h.id)).length;
  const total = tasks.length + habits.length;
  const done = doneTasks + doneHabits;
  const percent = total>0 ? Math.round((done/total)*100) : null;
  const xpDay = tasks.filter(t=>t.completed).reduce((s,t)=>s+t.xp,0) + doneHabits*10;
  return {tasksTotal:tasks.length, tasksDone:doneTasks, habitsTotal:habits.length, habitsDone:doneHabits, total, done, percent, xp:xpDay};
}

function recomputeStreak(){
  let d = new Date();
  let current = 0;
  let first = true;
  while(true){
    const ds = todayStr(d);
    const rec = dayRecord(ds);
    if(rec.percent===null){
      if(first && ds===todayStr()){ d.setDate(d.getDate()-1); first=false; continue; }
      break;
    }
    if(rec.percent >= state.user.dailyGoal){ current++; d.setDate(d.getDate()-1); first=false; }
    else break;
  }
  state.streak.current = current;
  if(current > (state.streak.longest||0)) state.streak.longest = current;
}

function recomputeAll(){
  recomputeStreak();
  checkAchievements();
  saveState();
}

function addXp(amount){
  const before = getLevelInfo(state.xp);
  state.xp += amount;
  const after = getLevelInfo(state.xp);
  if(after.level > before.level){
    setTimeout(()=> showCelebration('🎉','NOVO NÍVEL!','Você chegou ao nível '+after.level+'.'), 350);
  }
  checkAchievements();
}

function unlockAchievement(id){
  if(state.achievements[id] && state.achievements[id].unlocked) return;
  state.achievements[id] = {unlocked:true, date: todayStr()};
  const meta = ACHIEVEMENTS.find(a=>a.id===id);
  if(meta) setTimeout(()=> showCelebration(meta.emoji, 'Conquista desbloqueada!', meta.name), 400);
}

function checkAchievements(){
  const s = state.stats;
  if(s.totalTasksCompleted>=1) unlockAchievement('first_step');
  if(state.streak.longest>=7) unlockAchievement('streak7');
  if(state.streak.longest>=30) unlockAchievement('streak30');
  if(state.streak.longest>=100) unlockAchievement('streak100');
  if(state.streak.longest>=365) unlockAchievement('streak365');
  if(s.earlyCompletions>=1) unlockAchievement('early_bird');
  if(s.readingCompletions>=5) unlockAchievement('reader');
  if(s.goalsCompleted>=1) unlockAchievement('first_goal');
  if(state.xp>=1000) unlockAchievement('xp1000');
  if(state.xp>=10000) unlockAchievement('xp10000');
}

/* ================= TOAST / CELEBRATION ================= */
function showToast(msg, emoji){
  const root = document.getElementById('toastRoot');
  clearTimeout(toastTimer);
  root.innerHTML = '<div class="toast">'+(emoji||'✓')+' <span>'+msg+'</span></div>';
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 2400);
}
function showCelebration(emoji, title, sub){
  const root = document.getElementById('modalRoot');
  const div = document.createElement('div');
  div.className='celebrate-overlay';
  div.onclick = ()=> div.remove();
  div.innerHTML = '<div class="celebrate-card"><div class="celebrate-emoji">'+emoji+'</div><div class="celebrate-title">'+title+'</div><div class="celebrate-sub">'+sub+'</div><button class="btn btn-primary btn-block" onclick="this.closest(\'.celebrate-overlay\').remove()">Continuar</button></div>';
  root.appendChild(div);
}

/* ================= RENDER ROOT ================= */
function render(){
  recomputeStreak();
  const root = document.getElementById('root');
  if(!state.user.onboarded){
    root.innerHTML = renderOnboarding();
    return;
  }
  root.innerHTML = renderShell();
  saveState();
}

function navItems(){
  return [
    {id:'hoje', ic:'🏠', label:'Hoje'},
    {id:'rotina', ic:'📅', label:'Rotina'},
    {id:'metas', ic:'🎯', label:'Metas'},
    {id:'progresso', ic:'📊', label:'Progresso'},
  ];
}
function moreItems(){
  return [
    {id:'conquistas', ic:'🏆', label:'Conquistas'},
    {id:'diario', ic:'📝', label:'Diário'},
    {id:'foco', ic:'⏱️', label:'Modo Foco'},
    {id:'config', ic:'⚙️', label:'Configurações'},
  ];
}

function renderShell(){
  const page = state.page;
  const mobileMore = ['conquistas','diario','foco','config','mais'].includes(page);
  let body='';
  if(page==='hoje') body = renderHoje();
  else if(page==='rotina') body = renderRotina();
  else if(page==='metas') body = renderMetas();
  else if(page==='progresso') body = renderProgresso();
  else if(page==='conquistas') body = renderConquistas();
  else if(page==='diario') body = renderDiario();
  else if(page==='foco') body = renderFoco();
  else if(page==='config') body = renderConfig();
  else if(page==='mais') body = renderMais();
  else body = renderHoje();

  const allNav = navItems();
  const sidebarExtra = moreItems();

  return `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">MEU <span>FOCO</span></div>
      <nav>
        ${allNav.map(n=>`<button class="side-link ${page===n.id?'active':''}" onclick="goPage('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</button>`).join('')}
        <div style="height:10px;"></div>
        ${sidebarExtra.filter(x=>x.id!=='config').map(n=>`<button class="side-link ${page===n.id?'active':''}" onclick="goPage('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</button>`).join('')}
      </nav>
      <button class="side-link bottom-link ${page==='config'?'active':''}" onclick="goPage('config')"><span class="ic">⚙️</span>Configurações</button>
    </aside>
    <div class="main-col">
      <div class="page">${body}</div>
    </div>
  </div>
  <div class="bottom-nav">
    ${allNav.map(n=>`<button class="nav-btn ${page===n.id?'active':''}" onclick="goPage('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</button>`).join('')}
    <button class="nav-btn ${mobileMore?'active':''}" onclick="goPage('mais')"><span class="ic">☰</span>Mais</button>
  </div>
  `;
}

function goPage(p){ state.page = p; render(); }

/* ================= HOJE ================= */
function renderHoje(){
  const today = todayStr();
  const rec = dayRecord(today);
  const pct = rec.percent===null? 0 : rec.percent;
  const lvl = getLevelInfo(state.xp);
  const xpToday = state.tasks.filter(t=>t.date===today && t.completed).reduce((s,t)=>s+t.xp,0) +
    (state.habitLog[today]||[]).length*10;

  let motiv = MOTIV.start;
  if(rec.total>0){
    if(pct>=100) motiv = MOTIV.full;
    else if(pct>=50) motiv = MOTIV.half;
    else if(pct>0) motiv = MOTIV.low;
  }

  const priorities = state.tasks.filter(t=>t.date===today && t.isPriority);
  const periods = [
    {id:'manha', label:'☀️ MANHÃ'},
    {id:'tarde', label:'🌤️ TARDE'},
    {id:'noite', label:'🌙 NOITE'},
  ];

  return `
    <div class="topbar-mobile">
      <div></div>
    </div>
    <div class="greet-row">
      <div>
        <h1>${greeting()}, ${escapeHtml(state.user.name||'')} 👋</h1>
        <p class="date">${niceDate()}</p>
      </div>
      <div class="greet-actions">
        <span class="streak-pill">🔥 ${state.streak.current}</span>
        <button class="icon-btn" onclick="showToast('Nenhuma notificação nova','🔔')">🔔</button>
        <div class="avatar">${(state.user.name||'?').trim().charAt(0).toUpperCase()||'?'}</div>
      </div>
    </div>

    <div class="discipline-card">
      <div class="discipline-top">
        <div>
          <div class="discipline-label">Disciplina de hoje</div>
          <div class="discipline-pct num-display">${pct}%</div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="discipline-sub">${rec.done} de ${rec.total} ${rec.total===1?'item concluído':'itens concluídos'}</div>
      <div class="stat-row">
        <div class="stat-chip"><div class="v">${xpToday}</div><div class="l">XP hoje</div></div>
        <div class="stat-chip"><div class="v">${rec.tasksDone}/${rec.tasksTotal}</div><div class="l">Tarefas</div></div>
        <div class="stat-chip"><div class="v">${rec.habitsDone}/${rec.habitsTotal}</div><div class="l">Hábitos</div></div>
      </div>
      <div class="motiv-line">${motiv}</div>
    </div>

    <div class="section-title">Nível ${lvl.level}</div>
    <div class="card flat" style="padding:14px 16px;">
      <div class="bar-track" style="margin:0 0 8px 0;"><div class="bar-fill" style="width:${Math.round(lvl.xpInLevel/lvl.xpNeeded*100)}%; background:var(--accent);"></div></div>
      <div class="discipline-sub">${lvl.xpInLevel} / ${lvl.xpNeeded} XP</div>
    </div>

    <div class="section-title">⭐ Minhas 3 prioridades</div>
    ${priorities.length===0 ? `<div class="card empty-state"><div class="e-icon">⭐</div><div class="e-title">Nenhuma prioridade definida</div><div class="e-sub">Marque até 3 tarefas como prioridade ao criá-las.</div></div>` : priorities.map(t=>renderTaskItem(t)).join('')}

    ${periods.map(p=>{
      const items = state.tasks.filter(t=>t.date===today && t.period===p.id);

function renderHabitsToday(){
  const today = todayStr();
  const habits = habitsForDate(today);
  const log = state.habitLog[today]||[];
  if(habits.length===0) return `<div class="card empty-state"><div class="e-icon">🔁</div><div class="e-title">Nenhum hábito para hoje</div><div class="e-sub">Crie hábitos recorrentes na tela Rotina.</div></div>`;
  return habits.map(h=>{
    const done = log.includes(h.id);
    const cat = CATEGORIES.find(c=>c.id===h.category)||{ic:'📦'};
    return `
    <div class="item-row ${done?'completed':''}">
      <button class="checkbox ${done?'checked':''}" onclick="toggleHabit('${h.id}')">${done?'✓':''}</button>
      <div class="item-body">
        <div class="item-name">${escapeHtml(h.name)}</div>
        <div class="item-meta">
          ${h.time?`<span class="tag">${h.time}</span>`:''}
          <span class="tag">${cat.ic} ${cat.label}</span>
          <span class="xp-tag">+${h.xp} XP</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.completed = !t.completed;
  if(t.completed){
    addXp(t.xp);
    state.stats.totalTasksCompleted++;
    if(t.time && t.time < '07:00') state.stats.earlyCompletions++;
    const today = todayStr();
    const rec = dayRecord(today);
    if(rec.percent===100) setTimeout(()=>{ addXp(50); showToast('Todas as tarefas de hoje concluídas! +50 XP','🎉'); },300);
    playSound();
  }
  recomputeAll();
  render();
}

function toggleHabit(id){
  const today = todayStr();
  if(!state.habitLog[today]) state.habitLog[today]=[];
  const idx = state.habitLog[today].indexOf(id);
  const h = state.habits.find(x=>x.id===id);
  if(idx>=0){ state.habitLog[today].splice(idx,1); }
  else {
    state.habitLog[today].push(id);
    addXp(h?h.xp:10);
    state.stats.totalHabitsCompleted++;
    if(h && h.time && h.time < '07:00') state.stats.earlyCompletions++;
    if(h && /ler|leitura/i.test(h.name)) state.stats.readingCompletions++;
    playSound();
  }
  recomputeAll();
  render();
}

function deleteTask(id){
  confirmAction('Excluir tarefa?','Essa ação não pode ser desfeita.', ()=>{
    state.tasks = state.tasks.filter(t=>t.id!==id);
    recomputeAll(); render();
  });
}

function playSound(){
  if(!state.settings.sounds) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=0.06;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 120);
  }catch(e){}
}

function saveTask(id){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ showToast('Digite um nome para a tarefa','⚠️'); return; }
  const time = document.getElementById('f-time').value;
  const period = document.getElementById('f-period').dataset.value || window.__taskDraft.period;
  const category = document.getElementById('f-category').dataset.value || window.__taskDraft.category;
  const difficulty = document.getElementById('f-difficulty').dataset.value || window.__taskDraft.difficulty;
  const priority = document.getElementById('f-priority').dataset.value || window.__taskDraft.priority;
  const isPriority = document.getElementById('f-isprio').checked;
  const xp = DIFFICULTY_XP[difficulty];

  if(isPriority){
    const currentPriorities = state.tasks.filter(t=>t.isPriority && t.date===todayStr() && t.id!==id);
    if(currentPriorities.length>=3){ showToast('Você já tem 3 prioridades hoje','⚠️'); return; }
  }

  if(id){
    const t = state.tasks.find(x=>x.id===id);
    Object.assign(t, {name,time,period,category,difficulty,priority,xp,isPriority});
  } else {
    state.tasks.push({id:uid(), name, time, period, category, difficulty, priority, xp, date:todayStr(), completed:false, isPriority});
  }
  closeModal();
  recomputeAll(); render();
  showToast('Tarefa salva','✓');
}

function renderGoalCard(g){

    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="goal-progress-num">
      <span>${g.target>0 ? formatUnit(g.current,g.unit)+' / '+formatUnit(g.target,g.unit) : (g.completed?'Concluída':'Em andamento')}</span>

    ${!g.completed ? `<div style="display:flex; gap:8px; margin-top:12px;">

function formatDatePt(s){ const d=dateFromStr(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }

/* ================= PROGRESSO ================= */
function avgPercent(dates){
  const vals = dates.map(d=>dayRecord(d).percent).filter(v=>v!==null);
  if(vals.length===0) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function lastNDates(n, offset){
  offset = offset||0;
  const arr=[];
  for(let i=n-1;i>=0;i--){ arr.push(addDays(todayStr(), -i-offset)); }
  return arr;
}
function renderProgresso(){
  const week = lastNDates(7);
  const lastWeek = lastNDates(7,7);

let calMonthOffset = 0;
function renderCalendar(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth()+calMonthOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const todayS = todayStr();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = year+'-'+pad(month+1)+'-'+pad(d);
    const rec = dayRecord(ds);
    let dotColor = 'transparent';
    if(rec.percent!==null){
      if(rec.percent>=state.user.dailyGoal) dotColor='var(--good)';
      else if(rec.percent>=50) dotColor='var(--warn)';
      else dotColor='var(--bad)';
    } else if(ds < todayS) {
      dotColor = 'var(--text-3)';
    }
    cells += `<button class="cal-day ${ds===todayS?'today':''}" onclick="openDayDetail('${ds}')">${d}<span class="dot" style="background:${dotColor}"></span></button>`;
  }
  return `
    <div class="card">
      <div class="cal-nav">
        <button class="mini-btn" onclick="calMonthOffset--; render()">←</button>
        <span class="m-title">${MONTHS[month]} ${year}</span>
        <button class="mini-btn" onclick="calMonthOffset++; render()">→</button>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;
}
function openDayDetail(ds){
  const rec = dayRecord(ds);
  const j = state.journal[ds];
  renderModal(`
    <div class="modal-title">${formatDatePt(ds)}</div>
    ${rec.total===0 ? `<p class="small-muted">Nenhum registro para este dia.</p>` : `
    <div class="stat-row" style="margin-bottom:14px;">
      <div class="stat-chip"><div class="v">${rec.percent}%</div><div class="l">Disciplina</div></div>
      <div class="stat-chip"><div class="v">${rec.xp}</div><div class="l">XP</div></div>
      <div class="stat-chip"><div class="v">${rec.done}/${rec.total}</div><div class="l">Concluídos</div></div>
    </div>
    <p class="small-muted">Tarefas: ${rec.tasksDone}/${rec.tasksTotal} · Hábitos: ${rec.habitsDone}/${rec.habitsTotal}</p>

/* ================= MODO FOCO ================= */
let focusState = { duration:25*60, remaining:25*60, running:false, intervalId:null };
function renderFoco(){
  const mins = Math.floor(focusState.remaining/60);
  const secs = focusState.remaining%60;
  const pct = 1 - focusState.remaining/focusState.duration;
  return `
    <div class="greet-row"><h1 style="font-size:20px;">Modo Foco</h1></div>
    <div class="focus-wrap">
      <div style="display:flex; gap:8px; margin-bottom:22px;">
        ${[25,30,45,60].map(m=>`<button class="dur-opt ${focusState.duration===m*60 && !focusState.running?'selected':''}" onclick="setFocusDuration(${m})">${m} min</button>`).join('')}
      </div>
      <div class="focus-ring" style="background: conic-gradient(var(--primary) ${pct*360}deg, var(--surface-2) 0deg); ">
        <div style="width:220px; height:220px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column;">
          <div class="focus-time">${pad(mins)}:${pad(secs)}</div>
          <div class="small-muted">${focusState.running?'Em foco...':'Pronto para começar'}</div>
        </div>
      </div>
      <div class="focus-controls">
        <button class="focus-btn" onclick="resetFocus()">↻</button>
        <button class="focus-btn primary" onclick="toggleFocus()">${focusState.running?'⏸':'▶'}</button>
        <button class="focus-btn" onclick="toggleFocusSound()">${state.settings.sounds?'🔊':'🔇'}</button>
      </div>
    </div>
    <div class="section-title">Sessões recentes</div>
    ${state.focusSessions.length===0? `<div class="card empty-state"><div class="e-sub">Nenhuma sessão registrada ainda.</div></div>` :
      [...state.focusSessions].reverse().slice(0,8).map(s=>`
      <div class="item-row">
        <div class="item-body">
          <div class="item-name">${s.duration} minutos</div>
          <div class="item-meta"><span class="tag">${formatDatePt(s.date)}</span></div>
        </div>
      </div>`).join('')}
  `;
}
function setFocusDuration(m){
  if(focusState.running) return;
  focusState.duration = m*60; focusState.remaining = m*60;
  render();
}
function toggleFocus(){
  if(focusState.running){
    clearInterval(focusState.intervalId); focusState.running=false; render(); return;
  }
  focusState.running = true;
  render();
  focusState.intervalId = setInterval(()=>{
    focusState.remaining--;
    if(focusState.remaining<=0){
      clearInterval(focusState.intervalId);
      focusState.running=false;
      const minutesDone = focusState.duration/60;
      state.focusSessions.push({date:todayStr(), duration:minutesDone, completedAt:Date.now()});
      const xpGain = Math.round(minutesDone/5)*5;
      addXp(xpGain);
      playSound();
      recomputeAll();
      focusState.remaining = focusState.duration;
      render();
      setTimeout(()=> showCelebration('⏱️','Sessão concluída!','Você focou por '+minutesDone+' minutos. +'+xpGain+' XP.'), 200);
      return;
    }
    updateFocusDisplay();
  },1000);
}
function updateFocusDisplay(){
  const el = document.querySelector('.focus-time');
  const sub = document.querySelector('.focus-wrap .small-muted');
  const ring = document.querySelector('.focus-ring');
  if(!el) return;
  const mins = Math.floor(focusState.remaining/60);
  const secs = focusState.remaining%60;
  el.textContent = pad(mins)+':'+pad(secs);
  const pct = 1 - focusState.remaining/focusState.duration;
  if(ring) ring.style.background = 'conic-gradient(var(--primary) '+(pct*360)+'deg, var(--surface-2) 0deg)';
}
function resetFocus(){
  clearInterval(focusState.intervalId);
  focusState.running=false;
  focusState.remaining = focusState.duration;
  render();
}
function toggleFocusSound(){
  state.settings.sounds = !state.settings.sounds;
  saveState(); render();
}

function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      confirmAction('Importar dados?','Isso substituirá todos os seus dados atuais.', ()=>{
        state = Object.assign(defaultState(), data);
        document.body.setAttribute('data-theme', state.settings.theme);
        recomputeAll(); render();
        showToast('Dados importados com sucesso','✓');

  };

  ev.target.value='';
}

      <div class="field"><input id="onb-sleep" type="time" value="${onbData.sleep}" /></div>
      <button class="btn btn-primary btn-block" onclick="onbSaveSleep()">Continuar</button>
    `;
  } else if(onbStep===4){

      <div class="onb-sub">Percentual mínimo de disciplina para manter sua sequência.</div>
      <div class="field">

    `;
  } else if(onbStep===5){

    content = `
      <div class="onb-title">Escolha seu primeiro hábito</div>

    `;
  }

}

// ================= ALARMES 2.1 =================
function alarmRepeatLabel(r){
  return r==='daily'?'Todos os dias':r==='weekdays'?'Segunda a sexta':'Uma vez';
}
function requestAlarmPermission(){
  if(!('Notification' in window)) return showToast('Seu navegador não oferece notificações','⚠️');
  Notification.requestPermission().then(p=>{
    state.settings.notifications = p==='granted';
    saveState(); render();
    showToast(p==='granted'?'Notificações permitidas':'Permissão de notificações não concedida', p==='granted'?'🔔':'⚠️');
  });
}
function addAlarm(){
  const title=(document.getElementById('alarm-title')?.value||'').trim();
  const time=document.getElementById('alarm-time')?.value||'';
  const repeat=document.getElementById('alarm-repeat')?.value||'once';
  if(!title) return showToast('Digite o que o alarme deve lembrar','⚠️');
  if(!time) return showToast('Escolha um horário','⚠️');
  state.alarms=Array.isArray(state.alarms)?state.alarms:[];
  state.alarms.push({id:uid(),title,time,repeat,enabled:true,createdAt:Date.now()});
  saveState(); render(); showToast('Alarme criado','🔔');
}
function toggleAlarm(id){
  const a=(state.alarms||[]).find(x=>x.id===id); if(!a) return;
  a.enabled=!a.enabled; saveState(); render();
}
function deleteAlarm(id){
  state.alarms=(state.alarms||[]).filter(a=>a.id!==id);
  if(state.alarmLastFired) delete state.alarmLastFired[id];
  saveState(); render();
}
function openNativeAlarm(time,title){
  try{
    const [hour,minute]=time.split(':').map(Number);
    const url='intent:#Intent;action=android.intent.action.SET_ALARM;S.android.intent.extra.alarm.HOUR='+hour+';S.android.intent.extra.alarm.MINUTES='+minute+';S.android.intent.extra.alarm.MESSAGE='+encodeURIComponent(title)+';end';
    window.location.href=url;
  }catch(e){ showToast('Não foi possível abrir o alarme nativo','⚠️'); }
}
function checkAlarms(){
  if(!Array.isArray(state?.alarms)) return;
  const now=new Date(), hh=pad(now.getHours())+':'+pad(now.getMinutes()), dow=now.getDay(), today=todayStr();
  state.alarmLastFired=state.alarmLastFired||{};
  state.alarms.forEach(a=>{
    if(!a.enabled || a.time!==hh) return;
    const allowed=a.repeat==='daily' || (a.repeat==='weekdays' && dow>=1 && dow<=5) || (a.repeat==='once' && !a.lastDate);
    if(!allowed || state.alarmLastFired[a.id]===today) return;
    state.alarmLastFired[a.id]=today;
    if(a.repeat==='once') a.lastDate=today;
    try{ if(navigator.vibrate) navigator.vibrate([250,100,250]); }catch(e){}
    try{ if('Notification' in window && Notification.permission==='granted') new Notification('MEU FOCO',{body:a.title,tag:'meufoco-alarm-'+a.id}); }catch(e){}
    playSound();
    saveState();
  });
}
setInterval(checkAlarms,15000);
// Reminder support: browser notifications where permission is available.
function initReminders(){if(!state.settings.notifications||!('Notification'in window))return;if(Notification.permission==='default')Notification.requestPermission();}
function checkReminders(){if(!state.settings.notifications||!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date(),hh=pad(now.getHours())+':'+pad(now.getMinutes());state.tasks.filter(t=>t.date===todayStr()&&!t.completed&&t.time===hh).forEach(t=>{try{new Notification('MEU FOCO',{body:'Hora: '+t.name})}catch(e){}})}
setInterval(checkReminders,30000);setInterval(()=>{migrateV2();generateRecurringTasks();saveState()},60000);
setTimeout(()=>{migrateV2();generateRecurringTasks();initReminders();saveState()},1200);
